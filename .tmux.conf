set -g prefix C-t
unbind C-b
bind C-t next-window
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 300000
set -g mouse on
set -g set-titles on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g default-shell "$SHELL"

bind i split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind C-c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h previous-window
bind -r C-l next-window
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind s set-option synchronize-panes on
bind p set-option synchronize-panes off

setw -g mode-keys vi
setw -g clock-mode-style 24
setw -g automatic-rename on
setw -g monitor-activity on
set -g visual-activity on
set -g display-panes-time 3000
set -g repeat-time 1000

set -g status-style "fg=white,bg=black"
set -g window-status-format "[#I] #W"
set -g window-status-current-format "[#I] #W"
set -g window-status-current-style "fg=white,bg=red,bold"
set -g pane-border-style "fg=green,bg=default"
set -g pane-active-border-style "fg=yellow,bg=default"
set -g message-style "fg=white,bg=black,bold"
set -g status-justify centre
set -g status-left-length 80
set -g status-right-length 40
set -g status-interval 15
set -g status-left "#(~/.tmux/kube.tmux)"
set -g status-right "%Y-%m-%d %H:%M"

set -s set-clipboard on
if-shell -b 'command -v pbcopy >/dev/null 2>&1' \
  'set-option -s copy-command "pbcopy"' \
  'if-shell -b "command -v wl-copy >/dev/null 2>&1" \
    "set-option -s copy-command \"wl-copy\"" \
    "if-shell -b \"command -v xclip >/dev/null 2>&1\" \
      \"set-option -s copy-command \\\"xclip -selection clipboard\\\""'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" \
  "send-keys -M" \
  "if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
