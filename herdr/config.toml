onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+t"
new_tab = ["prefix+ctrl+c", "prefix+c"]
previous_tab = ["prefix+ctrl+h", "prefix+p"]
next_tab = ["prefix+ctrl+t", "prefix+ctrl+l", "prefix+n"]
split_vertical = "prefix+i"
split_horizontal = "prefix+v"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"
resize_mode = "prefix+shift+r"
reload_config = "prefix+r"
detach = ["prefix+d", "prefix+q"]

[ui]
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 15, timeout_seconds = 2 },
  { type = "datetime", format = "%Y-%m-%d %H:%M" },
]
tab_bar_right_separator = " · "
status_indicators = "symbols"
window_title = "{hostname}: {workspace} - {tab}"
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "state_text"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]
